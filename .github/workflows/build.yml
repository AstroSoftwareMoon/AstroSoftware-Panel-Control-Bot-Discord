name: Build Executables

on:
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter discord.py psutil requests

      - name: Build Windows Executable (.exe directo)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon "asbotlogo.ico" --add-data "locales;locales" --add-data "asbotlogo.ico;." --name "AstroBot" "astrobot.py"

      - name: Build Linux Executable (binario directo)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "locales:locales" --add-data "asbotlogo.ico:." --name "AstroBot-Linux" "astrobot.py"

      - name: Upload Windows .EXE to Release
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AstroBot.exe

      - name: Upload Linux Binary to Release
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AstroBot-Linux
