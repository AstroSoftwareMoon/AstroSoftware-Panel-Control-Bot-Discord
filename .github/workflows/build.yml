name: Build Executables

on:
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter discord.py psutil requests

      - name: Build Windows Executable
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon "asbotlogo.ico" --add-data "locales;locales" --add-data "asbotlogo.ico;." --name "AstroBot" "astrobot.py"
          Compress-Archive -Path dist/AstroBot/* -DestinationPath AstroBot-Windows.zip

      - name: Build Linux Executable
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "locales:locales" --add-data "asbotlogo.ico:." --name "AstroBot" "astrobot.py"
          cd dist/AstroBot
          zip -r ../../AstroBot-Linux.zip *
          cd ../..

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AstroBot-Windows.zip

      - name: Upload Release Asset (Linux)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AstroBot-Linux.zip
